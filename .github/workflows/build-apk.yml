          cat > app/src/main/java/com/weatherrealtime/app/KittenService.java <<'EOF'
          package com.weatherrealtime.app;

          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Message;
          import android.os.Messenger;

          /* The on-device AI voice (Kitten via sherpa-onnx), sealed inside its
             own ":voice" process. sherpa's native code calls _Exit() when its
             init fails, which would kill the whole app in the main process -
             here only this lightweight process dies, and the main process
             notices the binder death and falls back to the device voice.
             This class is the ONLY place that touches sherpa-onnx. */
          public class KittenService extends Service {
              static final int MSG_SPEAK = 1;
              static final int MSG_STOP = 2;
              static final int MSG_GET_STATE = 3;
              static final int MSG_STATE = 4;
              static final int MSG_DONE = 5;
              static final int MSG_READY = 6;

              private Messenger messenger;
              private final java.util.Set<Messenger> clients =
                  java.util.Collections.synchronizedSet(new java.util.HashSet<Messenger>());
              private com.k2fsa.sherpa.onnx.OfflineTts kittenTts = null;
              private volatile boolean kittenReady = false;
              private volatile String kittenError = null;
              private volatile int gen = 0;
              private volatile AudioTrack track = null;
              private volatile String speakInfo = "";

              @Override public void onCreate() {
                  super.onCreate();
                  messenger = new Messenger(new IncomingHandler(Looper.getMainLooper()));
                  startInit();
              }

              @Override public IBinder onBind(Intent intent) { return messenger.getBinder(); }

              private void mark(String s) {
                  try {
                      java.io.File d = new java.io.File(getFilesDir(), "kitten-voice");
                      d.mkdirs();
                      java.io.FileOutputStream o = new java.io.FileOutputStream(new java.io.File(d, ".step"));
                      o.write(s.getBytes("UTF-8"));
                      o.close();
                  } catch (Throwable ignored) {}
              }

              private void startInit() {
                  new Thread(new Runnable() { @Override public void run() {
                      try {
                          mark("init-start");
                          // The JitPack AAR only exposes
                          // OfflineTts(AssetManager, config): the native code
                          // reads model/voices/tokens straight from APK assets.
                          // Only espeak-ng-data must be real files, because
                          // espeak_Initialize needs a directory path.
                          java.io.File dest = new java.io.File(getFilesDir(), "kitten-voice");
                          java.io.File espeakDir = new java.io.File(dest, "espeak-ng-data");
                          java.io.File marker = new java.io.File(dest, ".ready-v2");
                          if (!marker.exists()) {
                              deleteRecursive(dest);
                              syncAssetDir("kitten-voice/espeak-ng-data", espeakDir);
                              marker.createNewFile();
                          }
                          mark("copy-done");
                          if (!espeakDir.isDirectory())
                              throw new RuntimeException("espeak data missing after copy");
                          mark("constructing");
                          android.content.res.AssetManager am = getAssets();
                          com.k2fsa.sherpa.onnx.OfflineTtsKittenModelConfig kitten =
                              new com.k2fsa.sherpa.onnx.OfflineTtsKittenModelConfig();
                          kitten.setModel("kitten-voice/model.onnx");
                          kitten.setVoices("kitten-voice/voices.bin");
                          kitten.setTokens("kitten-voice/tokens.txt");
                          kitten.setDataDir(espeakDir.getAbsolutePath());
                          com.k2fsa.sherpa.onnx.OfflineTtsModelConfig modelConfig =
                              new com.k2fsa.sherpa.onnx.OfflineTtsModelConfig();
                          modelConfig.setKitten(kitten);
                          modelConfig.setNumThreads(2);
                          com.k2fsa.sherpa.onnx.OfflineTtsConfig config =
                              new com.k2fsa.sherpa.onnx.OfflineTtsConfig();
                          config.setModel(modelConfig);
                          config.setMaxNumSentences(1);
                          // Use the ASSET-based constructor with the real
                          // AssetManager. The JitPack AAR only exposes
                          // OfflineTts(AssetManager, config); a null manager
                          // segfaults the :voice process during construction.
                          kittenTts = new com.k2fsa.sherpa.onnx.OfflineTts(am, config);
                          mark("constructed");
                          com.k2fsa.sherpa.onnx.GeneratedAudio warm =
                              kittenTts.generate("Voice ready.", 0, 1.0f);
                          float[] ws = warm != null ? warm.getSamples() : null;
                          if (ws == null || ws.length == 0)
                              throw new RuntimeException("warm-up produced no audio");
                          mark("ready");
                          speakInfo = "warm-up OK: " + ws.length + " samples";
                          kittenReady = true;
                      } catch (Throwable t) {
                          String msg = String.valueOf(t);
                          if (msg.length() > 300) msg = msg.substring(0, 300);
                          kittenError = msg;
                          mark("error: " + msg);
                      }
                      broadcastReady();
                  } }).start();
              }

              private void broadcastReady() {
                  try {
                      Message m = Message.obtain(null, MSG_READY);
                      m.arg1 = kittenReady ? 1 : 0;
                      m.obj = kittenReady ? null : kittenError;
                      synchronized (clients) {
                          for (Messenger c : clients) {
                              try { c.send(Message.obtain(m)); } catch (Throwable ignored) {}
                          }
                      }
                      m.recycle();
                  } catch (Throwable ignored) {}
              }

              private class IncomingHandler extends Handler {
                  IncomingHandler(Looper looper) { super(looper); }
                  @Override public void handleMessage(Message msg) {
                      try {
                          if (msg.replyTo != null) clients.add(msg.replyTo);
                          switch (msg.what) {
                              case MSG_SPEAK: {
                                  final int seq = msg.arg1;
                                  final String text = msg.obj instanceof String ? (String) msg.obj : "";
                                  final Messenger replyTo = msg.replyTo;
                                  if (!kittenReady || kittenTts == null || text.isEmpty()) {
                                      sendDone(replyTo, seq);
                                      break;
                                  }
                                  final int g = gen;
                                  new Thread(new Runnable() { @Override public void run() {
                                      speakWorker(seq, text, g, replyTo);
                                  } }).start();
                                  break;
                              }
                              case MSG_STOP:
                                  gen++;
                                  try { AudioTrack tr = track; if (tr != null) tr.stop(); } catch (Throwable ignored) {}
                                  break;
                              case MSG_GET_STATE: {
                                  Messenger replyTo = msg.replyTo;
                                  if (replyTo != null) {
                                      Message r = Message.obtain(null, MSG_STATE);
                                      r.arg1 = kittenReady ? 1 : 0;
                                      r.obj = kittenReady ? null : kittenError;
                                      try { replyTo.send(r); } catch (Throwable ignored) {}
                                  }
                                  break;
                              }
                          }
                      } catch (Throwable ignored) {}
                  }
              }

              private void sendDone(Messenger replyTo, int seq) {
                  if (replyTo == null) return;
                  try {
                      Message m = Message.obtain(null, MSG_DONE);
                      m.arg1 = seq;
                      replyTo.send(m);
                  } catch (Throwable ignored) {}
              }

              private void speakWorker(int seq, String text, int g, Messenger replyTo) {
                  try {
                      com.k2fsa.sherpa.onnx.OfflineTts tts = kittenTts;
                      if (tts == null || g != gen) { sendDone(replyTo, seq); return; }
                      com.k2fsa.sherpa.onnx.GeneratedAudio audio = tts.generate(text, 0, 1.0f);
                      if (g != gen) { sendDone(replyTo, seq); return; }
                      float[] samples = audio != null ? audio.getSamples() : null;
                      int sr = audio != null ? audio.getSampleRate() : 0;
                      if (samples == null || samples.length == 0 || sr <= 0) { sendDone(replyTo, seq); return; }
                      short[] pcm = new short[samples.length];
                      for (int i = 0; i < samples.length; i++) {
                          float v = Math.max(-1f, Math.min(1f, samples[i]));
                          pcm[i] = (short) (v * 32767);
                      }
                      int ch = AudioFormat.CHANNEL_OUT_MONO;
                      int fmt = AudioFormat.ENCODING_PCM_16BIT;
                      int minBuf = AudioTrack.getMinBufferSize(sr, ch, fmt);
                      AudioTrack tr = new AudioTrack(AudioManager.STREAM_MUSIC, sr, ch, fmt,
                          Math.max(minBuf, pcm.length * 2), AudioTrack.MODE_STREAM);
                      track = tr;
                      speakInfo = "played " + pcm.length + " samples @ " + sr + "Hz";
                      tr.play();
                      int off = 0;
                      while (off < pcm.length && g == gen) {
                          int len = Math.min(8192, pcm.length - off);
                          tr.write(pcm, off, len);
                          off += len;
                      }
                      try { tr.stop(); } catch (Throwable ignored) {}
                      try { tr.release(); } catch (Throwable ignored) {}
                      if (track == tr) track = null;
                  } catch (Throwable t) {
                      String msg = String.valueOf(t);
                      if (msg.length() > 200) msg = msg.substring(0, 200);
                      speakInfo = "speak FAILED: " + msg;
                  }
                  sendDone(replyTo, seq);
              }

              private void deleteRecursive(java.io.File f) {
                  try {
                      if (f == null || !f.exists()) return;
                      if (f.isDirectory()) {
                          java.io.File[] kids = f.listFiles();
                          if (kids != null) for (java.io.File k : kids) deleteRecursive(k);
                      }
                      f.delete();
                  } catch (Throwable ignored) {}
              }

              private void syncAssetDir(String assetPath, java.io.File dest) throws java.io.IOException {
                  String[] names = getAssets().list(assetPath);
                  if (names == null) return;
                  dest.mkdirs();
                  for (String n : names) {
                      String rel = assetPath.isEmpty() ? n : assetPath + "/" + n;
                      String[] sub = getAssets().list(rel);
                      if (sub != null && sub.length > 0) {
                          syncAssetDir(rel, new java.io.File(dest, n));
                      } else {
                          java.io.File out = new java.io.File(dest, n);
                          if (out.exists()) continue;
                          java.io.File part = new java.io.File(dest, n + ".part");
                          java.io.InputStream in = getAssets().open(rel);
                          java.io.FileOutputStream fos = new java.io.FileOutputStream(part);
                          byte[] buf = new byte[65536];
                          int r;
                          while ((r = in.read(buf)) > 0) fos.write(buf, 0, r);
                          fos.close();
                          in.close();
                          if (!part.renameTo(out)) {
                              java.io.FileInputStream fin = new java.io.FileInputStream(part);
                              java.io.FileOutputStream fout = new java.io.FileOutputStream(out);
                              byte[] b2 = new byte[65536];
                              int r2;
                              while ((r2 = fin.read(b2)) > 0) fout.write(b2, 0, r2);
                              fout.close();
                              fin.close();
                              part.delete();
                          }
                      }
                  }
              }
          }
          EOF

      - name: Fetch Kitten voice model (on-device AI voice)
        run: |
          mkdir -p app/src/main/assets/kitten-voice
          cd app/src/main/assets/kitten-voice
          # KittenTTS Micro, English (Apache 2.0, free to bundle): ~40MB model +
          # 3.2MB voices + the FULL espeak-ng-data (~19MB). An earlier build
          # shipped a trimmed English-only espeak-ng-data that was tested on
          # desktop only; sherpa's Android espeak init is pickier, so we ship
          # the complete data dir exactly like the official sherpa-onnx
          # Android TTS engine does.
          curl -fSL --retry 3 -o kitten.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kitten-micro-en-v0_8.tar.bz2"
          tar xf kitten.tar.bz2
          mv kitten-micro-en-v0_8/* .
          rm -rf kitten-micro-en-v0_8 kitten.tar.bz2
          ls -la
          du -sh .
          test -f model.onnx && test -f voices.bin && test -f tokens.txt && test -d espeak-ng-data

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-realtime-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          body: ${{ env.APP_RELEASE_NOTES }}
          files: app/build/outputs/apk/release/app-release.apk
