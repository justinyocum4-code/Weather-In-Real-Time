                          short[] pcm = new short[samples.length];
                          for (int i = 0; i < samples.length; i++) {
                              float v = Math.max(-1f, Math.min(1f, samples[i]));
                              pcm[i] = (short) (v * 32767);
                          }
                          int ch = AudioFormat.CHANNEL_OUT_MONO;
                          int fmt = AudioFormat.ENCODING_PCM_16BIT;
                          int minBuf = AudioTrack.getMinBufferSize(sr, ch, fmt);
                          AudioTrack tr = new AudioTrack(AudioManager.STREAM_MUSIC, sr, ch, fmt,
                              Math.max(minBuf, pcm.length * 2), AudioTrack.MODE_STREAM);
                          track = tr;
                          tr.play();
                          int off = 0;
                          while (off < pcm.length && g == gen) {
                              int len = Math.min(8192, pcm.length - off);
                              tr.write(pcm, off, len);
                              off += len;
                          }
                          try { tr.stop(); } catch (Throwable ignored) {}
                          try { tr.release(); } catch (Throwable ignored) {}
                          if (track == tr) track = null;
                          totalPlayed += off;
                      }
                      if (g == gen) markVoice("played OK " + totalPlayed + " samples");
                      else markVoice("cut short, played " + totalPlayed + " samples");
                      speakInfo = "played " + totalPlayed + " samples";
                  } catch (Throwable t) {
                      String msg = String.valueOf(t);
                      if (msg.length() > 200) msg = msg.substring(0, 200);
                      speakInfo = "speak FAILED: " + msg;
                      markVoice("speak FAILED: " + msg);
                  }
                  sendDone(replyTo, seq);
              }

              private void deleteRecursive(java.io.File f) {
                  try {
                      if (f == null || !f.exists()) return;
                      if (f.isDirectory()) {
                          java.io.File[] kids = f.listFiles();
                          if (kids != null) for (java.io.File k : kids) deleteRecursive(k);
                      }
                      f.delete();
                  } catch (Throwable ignored) {}
              }

              private void syncAssetDir(String assetPath, java.io.File dest) throws java.io.IOException {
                  String[] names = getAssets().list(assetPath);
                  if (names == null) return;
                  dest.mkdirs();
                  for (String n : names) {
                      String rel = assetPath.isEmpty() ? n : assetPath + "/" + n;
                      String[] sub = getAssets().list(rel);
                      if (sub != null && sub.length > 0) {
                          syncAssetDir(rel, new java.io.File(dest, n));
                      } else {
                          java.io.File out = new java.io.File(dest, n);
                          if (out.exists()) continue;
                          java.io.File part = new java.io.File(dest, n + ".part");
                          java.io.InputStream in = getAssets().open(rel);
                          java.io.FileOutputStream fos = new java.io.FileOutputStream(part);
                          byte[] buf = new byte[65536];
                          int r;
                          while ((r = in.read(buf)) > 0) fos.write(buf, 0, r);
                          fos.close();
                          in.close();
                          if (!part.renameTo(out)) {
                              java.io.FileInputStream fin = new java.io.FileInputStream(part);
                              java.io.FileOutputStream fout = new java.io.FileOutputStream(out);
                              byte[] b2 = new byte[65536];
                              int r2;
                              while ((r2 = fin.read(b2)) > 0) fout.write(b2, 0, r2);
                              fout.close();
                              fin.close();
                              part.delete();
                          }
                      }
                  }
              }

              // Builds an OfflineTts without running its public
              // constructor. The JitPack AAR only ships
              // OfflineTts(AssetManager, config), whose native side is not
              // exception-guarded and kills the process on any failure.
              // The native newFromFile IS guarded, so we allocate the
              // object via Unsafe, invoke newFromFile reflectively, and
              // set its native pointer field directly.
              private com.k2fsa.sherpa.onnx.OfflineTts newOfflineTtsFromFile(
                      com.k2fsa.sherpa.onnx.OfflineTtsConfig config) throws Exception {
                  Class<?> cls = Class.forName("com.k2fsa.sherpa.onnx.OfflineTts");
                  java.lang.reflect.Field fUnsafe =
                      Class.forName("sun.misc.Unsafe").getDeclaredField("theUnsafe");
                  fUnsafe.setAccessible(true);
                  Object unsafe = fUnsafe.get(null);
                  java.lang.reflect.Method alloc =
                      unsafe.getClass().getMethod("allocateInstance", Class.class);
                  Object tts = alloc.invoke(unsafe, cls);
                  java.lang.reflect.Method newFromFile = cls.getDeclaredMethod(
                      "newFromFile",
                      Class.forName("com.k2fsa.sherpa.onnx.OfflineTtsConfig"));
                  newFromFile.setAccessible(true);
                  // newFromFile may be an instance method: invoke it on the
                  // allocated object, not on null (null receiver NPEs).
                  Object recv = java.lang.reflect.Modifier.isStatic(
                      newFromFile.getModifiers()) ? null : tts;
                  long ptr = ((Long) newFromFile.invoke(recv, config)).longValue();
                  if (ptr == 0) throw new RuntimeException("newFromFile returned null pointer");
                  java.lang.reflect.Field fPtr = cls.getDeclaredField("ptr");
                  fPtr.setAccessible(true);
                  fPtr.setLong(tts, ptr);
                  return (com.k2fsa.sherpa.onnx.OfflineTts) tts;
              }
          }
          EOF

      - name: Fetch Kitten voice model (on-device AI voice)
        run: |
          mkdir -p app/src/main/assets/kitten-voice
          cd app/src/main/assets/kitten-voice
          # KittenTTS Nano v0.2, English (Apache 2.0, free to bundle): ~30MB fp16
          # model + voices + the FULL espeak-ng-data. NOTE: the newer
          # kitten-micro-en-v0_8 tarball ships a voices.bin format
          # (style_dim=400) that sherpa-onnx v1.12.40 rejects at native
          # init ("style_dim[0] should be 1"), killing the :voice process
          # with no catchable error. The nano v0.1/v0.2 format is what
          # v1.12.40 expects (verified by loading it with pip
          # sherpa-onnx==1.12.40 on desktop).
          curl -fSL --retry 3 -o kitten.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kitten-nano-en-v0_2-fp16.tar.bz2"
          tar xf kitten.tar.bz2
          mv kitten-nano-en-v0_2-fp16/* .
          rm -rf kitten-nano-en-v0_2-fp16 kitten.tar.bz2
          ls -la
          du -sh .
          test -f model.fp16.onnx && test -f voices.bin && test -f tokens.txt && test -d espeak-ng-data

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-realtime-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          body: ${{ env.APP_RELEASE_NOTES }}
          files: app/build/outputs/apk/release/app-release.apk
