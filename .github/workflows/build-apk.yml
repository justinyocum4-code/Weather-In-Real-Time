name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0)'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Version code - must be a whole number bigger than last time'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'What changed in this version (shown in the store)'
        required: false
        type: string
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || '1.0' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
      APP_RELEASE_NOTES: ${{ inputs.release_notes || 'Update' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        run: |
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then echo "ERROR: index.html missing in repo root."; exit 1; fi
          if ! grep -q 'id="weather-realtime-app"' "$HTML_FILE"; then echo "ERROR: weather-realtime-app marker missing."; exit 1; fi
          mkdir -p app/src/main/java/com/weatherrealtime/app app/src/main/assets/www
          cp "$HTML_FILE" app/src/main/assets/www/index.html
          mkdir -p app/src/main/res/drawable
          if [ -f tv_banner.png ]; then
            cp tv_banner.png app/src/main/res/drawable/tv_banner.png
            echo "TV banner installed."
          else
            echo "WARNING: tv_banner.png not found; Leanback banner skipped."
          fi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" } // sherpa-onnx (Kokoro voice engine)
              }
          }
          rootProject.name = "WeatherRealtime"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          # The Kokoro voice model roughly doubles the packaged assets, so the
          # default Gradle heap is no longer enough (run #78 died with
          # "Java heap space" in :app:collectReleaseDependencies after the
          # Kokoro Java code compiled cleanly). GitHub runners have 16GB RAM.
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.weatherrealtime.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.weatherrealtime.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
                  ndk {
                      // Phone + Android TV / Fire TV sticks. x86_64 (emulators) dropped to save size.
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }
              dependencies {
                  // On-device AI voice (Kokoro via sherpa-onnx). Official build, re-published by JitPack.
                  // v1.12.40 already includes Kokoro TTS support (added in sherpa-onnx 1.10.42).
                  implementation 'com.github.k2-fsa:sherpa-onnx:v1.12.40'
                  // The voice engine is written in Kotlin; without the stdlib it crashes
                  // on startup with NoClassDefFoundError (kotlin/jvm/internal/Intrinsics).
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
              }
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <application
                  android:label="Weather In Real Time"
                  android:banner="@drawable/tv_banner"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.weatherrealtime.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/weatherrealtime/app/MainActivity.java <<'EOF'
          package com.weatherrealtime.app;
          import android.app.Activity;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;
          public class MainActivity extends Activity {
              private WebView webView;
              private static final int LOCATION_REQUEST = 1002;
              private GeolocationPermissions.Callback pendingGeoCallback = null;
              private String pendingGeoOrigin = null;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String pendingTts = null;
              private int ttsUtteranceSeq = 0;
              // Kokoro on-device AI voice (sherpa-onnx): unlimited, offline.
              // This is the app's only voice — it speaks every announcement.
              private com.k2fsa.sherpa.onnx.OfflineTts kokoroTts = null;
              private volatile boolean kokoroReady = false;
              private volatile boolean kokoroStarting = false;
              private volatile int kokoroGen = 0; // invalidates in-flight Kokoro synthesis/playback on stop
              private volatile android.media.AudioTrack kokoroTrack = null;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Crash recorder: if anything ever slips past the guards,
                  // save a one-line reason so the app can report it on the
                  // next launch instead of dying mysteriously.
                  try {
                      final android.content.SharedPreferences crashP = getSharedPreferences("weather_realtime", MODE_PRIVATE);
                      final Thread.UncaughtExceptionHandler prevHandler = Thread.getDefaultUncaughtExceptionHandler();
                      Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                          @Override public void uncaughtException(Thread t, Throwable e) {
                              try {
                                  String msg = String.valueOf(e);
                                  if (msg.length() > 220) msg = msg.substring(0, 220);
                                  crashP.edit().putString("last_crash", msg).apply();
                              } catch (Throwable ignored) {}
                              try { if (prevHandler != null) prevHandler.uncaughtException(t, e); } catch (Throwable ignored) {}
                          }
                      });
                  } catch (Throwable ignored) {}
                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF000000); // never flash white on load/redraw
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false); // alert audio must play hands-free
                  webView.setWebViewClient(new WebViewClient());
                  webView.getSettings().setGeolocationEnabled(true);
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_COARSE_LOCATION}, LOCATION_REQUEST);
                          }
                      }
                  });
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setItem(String key, String value) {
                          try { getSharedPreferences("weather_realtime", MODE_PRIVATE).edit().putString(key, value).commit(); } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public String getItem(String key) {
                          try { return getSharedPreferences("weather_realtime", MODE_PRIVATE).getString(key, null); } catch (Exception e) { return null; }
                      }
                      @JavascriptInterface
                      public String getLastCrash() {
                          try {
                              android.content.SharedPreferences p = getSharedPreferences("weather_realtime", MODE_PRIVATE);
                              String c = p.getString("last_crash", null);
                              if (c != null) p.edit().remove("last_crash").apply();
                              return c == null ? "" : c;
                          } catch (Exception e) { return ""; }
                      }
                      @JavascriptInterface
                      public void removeItem(String key) {
                          try { getSharedPreferences("weather_realtime", MODE_PRIVATE).edit().remove(key).commit(); } catch (Exception ignored) {}
                      }
                  }, "LynxosStore");
                  initTts();
                  kokoroEnsureInit(); // warm up the offline AI voice in the background
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public String speak(String text) {
                          if (text == null) return null;
                          if (ttsReady && tts != null) {
                              return doTtsSpeak(text);
                          } else { pendingTts = text; return null; }
                      }
                      @JavascriptInterface
                      public void stop() {
                          pendingTts = null;
                          try { if (tts != null) tts.stop(); } catch (Exception ignored) {}
                      }
                  }, "LynxosTts");

                  /* Kokoro on-device AI voice: the app's only voice. Unlimited
                     and offline — no key, no quota. Returns an utterance id,
                     or null when the voice isn't warmed up yet (the page then
                     falls through to the built-in voice). Synthesis runs on a
                     worker thread; playback goes through one serialized
                     AudioTrack so utterances can never double up. */
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public String speak(String text) {
                          try {
                              if (text == null || text.isEmpty()) return null;
                              if (!kokoroReady || kokoroTts == null) { kokoroEnsureInit(); return null; }
                              kokoroGen++; // silence anything currently playing
                              try { android.media.AudioTrack tr = kokoroTrack; if (tr != null) tr.stop(); } catch (Throwable ignored) {}
                              final String id = "kv" + (++ttsUtteranceSeq);
                              final int gen = kokoroGen;
                              final String t = text;
                              new Thread(new Runnable() { @Override public void run() {
                                  kokoroSpeakWorker(id, t, gen);
                              } }).start();
                              return id;
                          } catch (Throwable th) { return null; }
                      }
                      @JavascriptInterface
                      public void stop() {
                          kokoroGen++;
                          try { android.media.AudioTrack tr = kokoroTrack; if (tr != null) tr.stop(); } catch (Throwable ignored) {}
                      }
                      // True once the offline AI voice is warmed up and speaking.
                      // The page uses this to tell the user whether the new
                      // voice is ready or still setting up.
                      @JavascriptInterface
                      public boolean isReady() { return kokoroReady && kokoroTts != null; }
                      // If the last init attempt failed, the reason (saved to
                      // a file so it survives to the next launch, when the app
                      // reads it aloud as a startup heads-up). Empty when the
                      // voice is ready or no failure was recorded.
                      @JavascriptInterface
                      public String getLastError() {
                          try {
                              if (kokoroReady) return "";
                              java.io.File f = new java.io.File(getFilesDir(), "kokoro-voice/.last-error");
                              if (!f.exists()) return "";
                              java.io.FileInputStream in = new java.io.FileInputStream(f);
                              byte[] b = new byte[(int) Math.min(f.length(), 512)];
                              int n = in.read(b); in.close();
                              if (n <= 0) return "";
                              return new String(b, 0, n, "UTF-8");
                          } catch (Throwable th) { return ""; }
                      }
                  }, "KokoroVoice");
                  if (savedInstanceState != null) { webView.restoreState(savedInstanceState); }
                  else { webView.loadUrl("file:///android_asset/www/index.html"); }
                  setContentView(webView);
                  webView.requestFocus();
              }
              /* Copy the bundled Kokoro voice out of the APK into private
                 storage (native code needs real file paths), then build
                 the sherpa-onnx TTS engine on a worker thread. The copy is
                 resumable: files already synced are skipped and each file is
                 written atomically, so killing the app mid-copy just resumes
                 next launch instead of starting over. */
              private void kokoroEnsureInit() {
                  if (kokoroReady || kokoroStarting) return;
                  kokoroStarting = true;
                  new Thread(new Runnable() { @Override public void run() {
                      try {
                          java.io.File dest = new java.io.File(getFilesDir(), "kokoro-voice");
                          java.io.File marker = new java.io.File(dest, ".ready");
                          java.io.File errFile = new java.io.File(dest, ".last-error");
                          if (!marker.exists()) {
                              syncAssetDir("kokoro-voice", dest);
                              marker.createNewFile();
                          }
                          java.io.File modelFile = findFirstEndingWith(dest, ".onnx", ".onnx.json");
                          java.io.File voicesFile = findFirstEndingWith(dest, "voices.bin", null);
                          java.io.File tokensFile = findFirstEndingWith(dest, "tokens.txt", null);
                          java.io.File lexiconFile = findFirstEndingWith(dest, "lexicon-us-en.txt", null);
                          java.io.File dataDir = findDirNamed(dest, "espeak-ng-data");
                          if (modelFile == null || voicesFile == null || tokensFile == null)
                              throw new RuntimeException("kokoro model not found");
                          // sherpa-onnx Java API: no-arg constructors + setters
                          // (per the official sherpa-onnx TTS docs). The Android
                          // OfflineTts takes the app AssetManager plus config;
                          // absolute file paths are resolved as real files.
                          // Voice: am_michael (sid 16), American male.
                          com.k2fsa.sherpa.onnx.OfflineTtsKokoroModelConfig kokoro =
                              new com.k2fsa.sherpa.onnx.OfflineTtsKokoroModelConfig();
                          kokoro.setModel(modelFile.getAbsolutePath());
                          kokoro.setVoices(voicesFile.getAbsolutePath());
                          kokoro.setTokens(tokensFile.getAbsolutePath());
                          kokoro.setDataDir(dataDir != null ? dataDir.getAbsolutePath() : "");
                          if (lexiconFile != null) kokoro.setLexicon(lexiconFile.getAbsolutePath());
                          com.k2fsa.sherpa.onnx.OfflineTtsModelConfig modelConfig =
                              new com.k2fsa.sherpa.onnx.OfflineTtsModelConfig();
                          modelConfig.setKokoro(kokoro);
                          modelConfig.setNumThreads(2);
                          com.k2fsa.sherpa.onnx.OfflineTtsConfig config =
                              new com.k2fsa.sherpa.onnx.OfflineTtsConfig();
                          config.setModel(modelConfig);
                          config.setMaxNumSentences(1);
                          kokoroTts = new com.k2fsa.sherpa.onnx.OfflineTts(getAssets(), config);
                          try { kokoroTts.generate("Voice ready.", 16, 1.0f); } catch (Throwable ignored) {} // warm-up
                          kokoroReady = true;
                          try { errFile.delete(); } catch (Throwable ignored) {}
                      } catch (Throwable t) {
                          // Persist the reason so the next launch can report it
                          // aloud instead of failing silently forever.
                          try {
                              java.io.File dest = new java.io.File(getFilesDir(), "kokoro-voice");
                              dest.mkdirs();
                              String msg = String.valueOf(t);
                              if (msg.length() > 300) msg = msg.substring(0, 300);
                              java.io.FileOutputStream out = new java.io.FileOutputStream(new java.io.File(dest, ".last-error"));
                              out.write(msg.getBytes("UTF-8"));
                              out.close();
                          } catch (Throwable ignored) {}
                          kokoroStarting = false; // let a later speak() retry
                      }
                  } }).start();
              }
              /* Synthesize one utterance, then stream it to AudioTrack in
                 chunks, checking the generation counter so stop() or a
                 newer utterance always wins. Fires __onTtsDone exactly
                 once per completed utterance; a stale generation exits
                 silently because its replacement owns the queue now. */
              private void kokoroSpeakWorker(String id, String text, int gen) {
                  try {
                      // sid 16 = am_michael, the app's American male voice.
                      com.k2fsa.sherpa.onnx.GeneratedAudio audio = kokoroTts.generate(text, 16, 1.0f);
                      if (gen != kokoroGen) return;
                      float[] samples = audio.getSamples();
                      int sampleRate = audio.getSampleRate();
                      if (samples == null || samples.length == 0 || sampleRate <= 0) {
                          jsCall("window.__onTtsDone('" + id + "')");
                          return;
                      }
                      byte[] pcm = new byte[samples.length * 2];
                      for (int i = 0; i < samples.length; i++) {
                          float s = samples[i];
                          if (s > 1.0f) s = 1.0f; else if (s < -1.0f) s = -1.0f;
                          int v = (int) (s * 32767.0f);
                          pcm[2 * i] = (byte) (v & 0xff);
                          pcm[2 * i + 1] = (byte) ((v >> 8) & 0xff);
                      }
                      int minBuf = android.media.AudioTrack.getMinBufferSize(sampleRate,
                          android.media.AudioFormat.CHANNEL_OUT_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT);
                      android.media.AudioTrack track = new android.media.AudioTrack(
                          android.media.AudioManager.STREAM_MUSIC, sampleRate,
                          android.media.AudioFormat.CHANNEL_OUT_MONO,
                          android.media.AudioFormat.ENCODING_PCM_16BIT,
                          Math.max(minBuf, 8192), android.media.AudioTrack.MODE_STREAM);
                      kokoroTrack = track;
                      track.play();
                      int off = 0;
                      while (off < pcm.length && gen == kokoroGen) {
                          int len = Math.min(8192, pcm.length - off);
                          track.write(pcm, off, len);
                          off += len;
                      }
                      try { track.stop(); } catch (Throwable ignored) {}
                      try { track.release(); } catch (Throwable ignored) {}
                      if (kokoroTrack == track) kokoroTrack = null;
                      if (gen == kokoroGen) jsCall("window.__onTtsDone('" + id + "')");
                  } catch (Throwable t) {
                      // Claimed the utterance but couldn't render it:
                      // advance the queue rather than stalling it.
                      try { jsCall("window.__onTtsDone('" + id + "')"); } catch (Throwable ignored) {}
                  }
              }
              /* Copy one asset tree into private storage, skipping files that
                 are already there. Each file is written to a .part file and
                 renamed, so a kill mid-copy can never leave a half file:
                 anything present is complete, and the next launch resumes
                 where the last one stopped. */
              private void syncAssetDir(String assetPath, java.io.File dest) throws java.io.IOException {
                  String[] list = getAssets().list(assetPath);
                  if (list == null || list.length == 0) {
                      if (dest.exists()) return; // already synced
                      java.io.InputStream in = getAssets().open(assetPath);
                      dest.getParentFile().mkdirs();
                      java.io.File tmp = new java.io.File(dest.getParentFile(), dest.getName() + ".part");
                      java.io.OutputStream out = new java.io.FileOutputStream(tmp);
                      byte[] buf = new byte[131072];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close(); out.close();
                      if (!tmp.renameTo(dest)) { dest.delete(); tmp.renameTo(dest); }
                      return;
                  }
                  dest.mkdirs();
                  for (String name : list) syncAssetDir(assetPath + "/" + name, new java.io.File(dest, name));
              }
              private java.io.File findFirstEndingWith(java.io.File dir, String ext, String skipExt) {
                  try {
                      java.io.File[] kids = dir.listFiles();
                      if (kids == null) return null;
                      for (java.io.File k : kids) {
                          if (k.isDirectory()) { java.io.File r = findFirstEndingWith(k, ext, skipExt); if (r != null) return r; }
                          else { String n = k.getName(); if (n.endsWith(ext) && (skipExt == null || !n.endsWith(skipExt))) return k; }
                      }
                  } catch (Throwable ignored) {}
                  return null;
              }
              private java.io.File findDirNamed(java.io.File dir, String name) {
                  try {
                      java.io.File[] kids = dir.listFiles();
                      if (kids == null) return null;
                      for (java.io.File k : kids) {
                          if (k.isDirectory()) {
                              if (name.equals(k.getName())) return k;
                              java.io.File r = findDirNamed(k, name); if (r != null) return r;
                          }
                      }
                  } catch (Throwable ignored) {}
                  return null;
              }
              private void initTts() {
                  String engine = null;
                  try {
                      // Prefer Google's TTS engine — its voices sound far more
                      // human than the stock Samsung engine on most devices.
                      getPackageManager().getPackageInfo("com.google.android.tts", 0);
                      engine = "com.google.android.tts";
                  } catch (Exception ignored) {}
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try {
                                  int result = tts.setLanguage(Locale.US);
                                  ttsReady = result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED;
                              } catch (Exception e) { ttsReady = false; }
                              if (ttsReady) {
                                  try {
                                      // Slightly under 1.0: calmer, more natural pacing.
                                      tts.setSpeechRate(0.85f);
                                      // A touch lower than default pitch reads warmer, less robotic.
                                      tts.setPitch(0.93f);
                                      pickBestTtsVoice();
                                      // The voice list can load late — re-pick once it arrives.
                                      try { new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() { @Override public void run() { pickBestTtsVoice(); } }, 3000); } catch (Exception ignored2) {}
                                      tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                          @Override public void onStart(String utteranceId) {}
                                          @Override public void onDone(String utteranceId) { ttsDoneCallback(utteranceId); }
                                          @Override public void onError(String utteranceId) { ttsDoneCallback(utteranceId); }
                                          @Override public void onStop(String utteranceId, boolean interrupted) { ttsDoneCallback(utteranceId); }
                                      });
                                  } catch (Exception ignored) {}
                                  if (pendingTts != null) {
                                      String text = pendingTts; pendingTts = null;
                                      try { doTtsSpeak(text); } catch (Exception ignored) {}
                                  }
                              }
                          }
                      }
                  }, engine);
              }
              /* Pick the highest-quality English voice the engine offers.
                 Neural / natural / premium voices sound far more human than
                 the default compact voice, so prefer them by name and quality. */
              private void pickBestTtsVoice() {
                  try {
                      if (tts == null) return;
                      java.util.Set<android.speech.tts.Voice> voices = tts.getVoices();
                      if (voices == null || voices.isEmpty()) return;
                      android.speech.tts.Voice best = null;
                      int bestScore = -1000000;
                      for (android.speech.tts.Voice v : voices) {
                          java.util.Locale loc = v.getLocale();
                          if (loc == null || !"en".equalsIgnoreCase(loc.getLanguage())) continue;
                          String n = v.getName() == null ? "" : v.getName().toLowerCase(java.util.Locale.US);
                          int s = 0;
                          // Justin wants the US voice, not the British one.
                          if ("US".equalsIgnoreCase(loc.getCountry())) s += 100;
                          else s -= 100;
                          if (n.contains("wavenet")) s += 60;
                          if (n.contains("neural")) s += 50;
                          if (n.contains("natural")) s += 40;
                          if (n.contains("premium") || n.contains("enhanced")) s += 30;
                          if (n.contains("google")) s += 20;
                          if (n.contains("compact") || n.contains("robot")) s -= 60;
                          try {
                              int q = v.getQuality();
                              if (q >= 400) s += 25;
                              else if (q >= 300) s += 10;
                          } catch (Exception ignored) {}
                          if (v.isNetworkConnectionRequired()) s -= 5;
                          if (s > bestScore) { bestScore = s; best = v; }
                      }
                      if (best != null) { try { tts.setVoice(best); } catch (Exception ignored) {} }
                  } catch (Exception ignored) {}
              }
              private void jsCall(final String expr) {
                  try {
                      final WebView wv = webView;
                      if (wv == null) return;
                      wv.post(new Runnable() {
                          @Override public void run() {
                              try { wv.evaluateJavascript(expr, null); } catch (Exception ignored) {}
                          }
                      });
                  } catch (Exception ignored) {}
              }
              private String doTtsSpeak(String text) {
                  String id = "utt" + (++ttsUtteranceSeq);
                  try { tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id); } catch (Exception ignored) {}
                  return id;
              }
              private void ttsDoneCallback(final String utteranceId) {
                  try {
                      final WebView wv = webView;
                      if (wv == null) return;
                      wv.post(new Runnable() {
                          @Override public void run() {
                              try { wv.evaluateJavascript("window.__onTtsDone('" + utteranceId + "')", null); } catch (Exception ignored) {}
                          }
                      });
                  } catch (Exception ignored) {}
              }
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == LOCATION_REQUEST) {
                      boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (pendingGeoCallback != null) {
                          try { pendingGeoCallback.invoke(pendingGeoOrigin, granted, false); } catch (Exception ignored) {}
                          pendingGeoCallback = null; pendingGeoOrigin = null;
                      }
                  }
              }
              @Override
              protected void onDestroy() {
                  if (tts != null) { try { tts.stop(); tts.shutdown(); } catch (Exception ignored) {} tts = null; }
                  super.onDestroy();
              }
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) { webView.saveState(outState); }
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) { webView.goBack(); } else { super.onBackPressed(); }
              }
          }
          EOF

      - name: Download Kokoro voice model (offline AI voice)
        run: |
          set -e
          mkdir -p app/src/main/assets/kokoro-voice
          cd app/src/main/assets/kokoro-voice
          # Official sherpa-onnx TTS release (per the sherpa-onnx docs):
          # kokoro-int8-multi-lang-v1_0 — a much more natural-sounding
          # on-device voice (Apache 2.0, free to bundle). The tarball
          # contains model.int8.onnx, voices.bin, tokens.txt, lexicon
          # files and espeak-ng-data/. Extracted into the APK assets,
          # copied to private storage on first launch, and spoken through
          # the KokoroVoice native bridge for every announcement.
          # am_michael (sid 16) is the app's American male voice.
          curl -fSL --retry 3 -o kokoro-voice.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2"
          tar -xjf kokoro-voice.tar.bz2
          rm kokoro-voice.tar.bz2
          echo "Kokoro voice assets:"
          find . -type f | head -20
          du -sh .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-realtime-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          body: ${{ env.APP_RELEASE_NOTES }}
          files: app/build/outputs/apk/release/app-release.apk
