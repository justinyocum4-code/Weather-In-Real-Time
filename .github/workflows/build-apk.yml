name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0)'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Version code - must be a whole number bigger than last time'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'What changed in this version (shown in the store)'
        required: false
        type: string
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || '1.0' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
      APP_RELEASE_NOTES: ${{ inputs.release_notes || 'Update' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Inject TomTom key (if the TOMTOM_KEY repo secret is set)
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          if [ -n "$TOMTOM_KEY" ]; then
            python3 - "$TOMTOM_KEY" <<'PYEOF'
          import sys
          key = sys.argv[1]
          p = "index.html"
          s = open(p).read()
          assert "%%TOMTOM_KEY%%" in s, "TomTom key placeholder missing from index.html"
          open(p, "w").write(s.replace("%%TOMTOM_KEY%%", key))
          print("TomTom key injected into index.html.")
          PYEOF
          else
            echo "No TOMTOM_KEY secret set; the traffic layer stays silent."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        run: |
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then echo "ERROR: index.html missing in repo root."; exit 1; fi
          if ! grep -q 'id="weather-realtime-app"' "$HTML_FILE"; then echo "ERROR: weather-realtime-app marker missing."; exit 1; fi
          mkdir -p app/src/main/java/com/weatherrealtime/app app/src/main/assets/www
          cp "$HTML_FILE" app/src/main/assets/www/index.html
          mkdir -p app/src/main/res/drawable
          if [ -f tv_banner.png ]; then
            cp tv_banner.png app/src/main/res/drawable/tv_banner.png
            echo "TV banner installed."
          else
            echo "WARNING: tv_banner.png not found; Leanback banner skipped."
          fi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" } // sherpa-onnx (Kitten voice engine)
              }
          }
          rootProject.name = "WeatherRealtime"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          # Larger Gradle heap for safety on the CI runners (GitHub runners have 16GB RAM).
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.weatherrealtime.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.weatherrealtime.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
                  ndk {
                      // Phone + Android TV / Fire TV sticks. x86_64 (emulators) dropped to save size.
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }
              dependencies {
                  implementation 'androidx.core:core:1.12.0'
                  // On-device AI voice (Kitten via sherpa-onnx). Official build, re-published by JitPack.
                  implementation 'com.github.k2-fsa:sherpa-onnx:v1.12.40'
                  // The voice engine is written in Kotlin; without the stdlib it crashes
                  // on startup with NoClassDefFoundError (kotlin/jvm/internal/Intrinsics).
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
              }
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <application
                  android:label="Weather In Real Time"
                  android:banner="@drawable/tv_banner"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.weatherrealtime.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.weatherrealtime.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
                  <!-- The AI voice runs sealed inside its own process. If its
                       native code ever crashes, only this process dies; the
                       app's main process keeps running on the device voice. -->
                  <service
                      android:name="com.weatherrealtime.app.KittenService"
                      android:process=":voice"
                      android:exported="false" />
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="downloads" path="Download/" />
          </paths>
          EOF
          cat > app/src/main/java/com/weatherrealtime/app/MainActivity.java <<'EOF'
          package com.weatherrealtime.app;
          import android.app.Activity;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;
          public class MainActivity extends Activity {
              private WebView webView;
              private static final int LOCATION_REQUEST = 1002;
              private GeolocationPermissions.Callback pendingGeoCallback = null;
              private String pendingGeoOrigin = null;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String pendingTts = null;
              private long lastBackPress = 0;
              private int ttsUtteranceSeq = 0;
              // Kitten on-device AI voice: every line of sherpa-onnx native
              // code runs inside KittenService, in its own ":voice" process.
              // This activity only holds a Messenger to it. If native code
              // ever kills its process again, this one survives and speech
              // falls back to the device voice.
              private android.os.Messenger voiceService = null;
              private boolean voiceBound = false;
              private boolean voiceReady = false; // the :voice process warmed up
              private boolean voiceDead = false;  // its process died / never came up
              private String voiceError = "";     // last voice failure, plain words
              private String kittenSpeakInfo = "";
              private String lastVoiceUtteranceId = null; // completed if the voice process dies mid-utterance
              private android.os.Messenger voiceReply = null; // receives MSG_DONE / MSG_STATE
              private final android.os.IBinder.DeathRecipient voiceDeath = new android.os.IBinder.DeathRecipient() {
                  @Override public void binderDied() { onVoiceDied("the voice process stopped", true); }
              };
              private final android.content.ServiceConnection voiceConn = new android.content.ServiceConnection() {
                  @Override public void onServiceConnected(android.content.ComponentName n, android.os.IBinder b) {
                      try {
                          voiceService = new android.os.Messenger(b);
                          b.linkToDeath(voiceDeath, 0);
                          voiceBound = true;
                          android.os.Message m = android.os.Message.obtain(null, KittenService.MSG_GET_STATE);
                          m.replyTo = voiceReply;
                          voiceService.send(m);
                      } catch (Throwable ignored) {}
                  }
                  @Override public void onServiceDisconnected(android.content.ComponentName n) {
                      onVoiceDied("the voice service disconnected", true);
                  }
              };
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Crash recorder: if anything ever slips past the guards,
                  // save a one-line reason so the app can report it on the
                  // next launch instead of dying mysteriously.
                  try {
                      final android.content.SharedPreferences crashP = getSharedPreferences("weather_realtime", MODE_PRIVATE);
                      final Thread.UncaughtExceptionHandler prevHandler = Thread.getDefaultUncaughtExceptionHandler();
                      Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                          @Override public void uncaughtException(Thread t, Throwable e) {
                              try {
                                  String msg = String.valueOf(e);
                                  if (msg.length() > 220) msg = msg.substring(0, 220);
                                  crashP.edit().putString("last_crash", msg).apply();
                              } catch (Throwable ignored) {}
                              try { if (prevHandler != null) prevHandler.uncaughtException(t, e); } catch (Throwable ignored) {}
                          }
                      });
                  } catch (Throwable ignored) {}
                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF000000); // never flash white on load/redraw
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false); // alert audio must play hands-free
                  webView.setWebViewClient(new WebViewClient());
                  webView.getSettings().setGeolocationEnabled(true);
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_COARSE_LOCATION}, LOCATION_REQUEST);
                          }
                      }
                  });
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setItem(String key, String value) {
                          try { getSharedPreferences("weather_realtime", MODE_PRIVATE).edit().putString(key, value).commit(); } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public String getItem(String key) {
                          try { return getSharedPreferences("weather_realtime", MODE_PRIVATE).getString(key, null); } catch (Exception e) { return null; }
                      }
                      @JavascriptInterface
                      public String getLastCrash() {
                          try {
                              android.content.SharedPreferences p = getSharedPreferences("weather_realtime", MODE_PRIVATE);
                              String c = p.getString("last_crash", null);
                              if (c != null) p.edit().remove("last_crash").apply();
                              return c == null ? "" : c;
                          } catch (Exception e) { return ""; }
                      }
                      @JavascriptInterface
                      public void removeItem(String key) {
                          try { getSharedPreferences("weather_realtime", MODE_PRIVATE).edit().remove(key).commit(); } catch (Exception ignored) {}
                      }
                  }, "LynxosStore");
                  initTts();
                  bindVoiceService(); // the AI voice warms up in its own process
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public String speak(String text) {
                          if (text == null) return null;
                          if (ttsReady && tts != null) {
                              return doTtsSpeak(text);
                          } else { pendingTts = text; return null; }
                      }
                      @JavascriptInterface
                      public void stop() {
                          pendingTts = null;
                          try { if (tts != null) tts.stop(); } catch (Exception ignored) {}
                      }
                      /* The device voice is no longer a choice — it only
                         speaks one emergency sentence if the AI voice fails
                         to load. The voice picker is gone. */
                  }, "LynxosTts");
                  /* Kitten on-device AI voice, served through the :voice
                     process. Returns an utterance id the page maps back via
                     window.__onTtsDone. If the AI voice isn't up yet — or its
                     process died — the utterance is spoken with the device
                     voice instead, so the app never goes silent and never
                     crashes. Same Javascript interface as before, so the page
                     needs no changes. */
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public String speak(String text) {
                          try {
                              if (text == null || text.isEmpty()) { kittenSpeakInfo = "speak skipped: empty text"; return null; }
                              if (voiceReady && voiceService != null && !voiceDead) {
                                  final String id = "kv" + (++ttsUtteranceSeq);
                                  kittenSpeakInfo = "AI voice: " + text.length() + " chars";
                                  try {
                                      android.os.Message m = android.os.Message.obtain(null, KittenService.MSG_SPEAK);
                                      m.arg1 = ttsUtteranceSeq;
                                      m.obj = text;
                                      m.replyTo = voiceReply;
                                      voiceService.send(m);
                                      lastVoiceUtteranceId = id;
                                      return id;
                                  } catch (Throwable th) {
                                      onVoiceDied("could not reach the voice service", true);
                                  }
                              }
                              // Device-voice fallback.
                              return deviceSpeak(text);
                          } catch (Throwable th) {
                              String msg = String.valueOf(th);
                              if (msg.length() > 200) msg = msg.substring(0, 200);
                              kittenSpeakInfo = "speak FAILED at entry: " + msg;
                              return null;
                          }
                      }
                      @JavascriptInterface
                      public void stop() {
                          try {
                              if (voiceService != null && !voiceDead) {
                                  try { voiceService.send(android.os.Message.obtain(null, KittenService.MSG_STOP)); } catch (Throwable ignored) {}
                              }
                          } catch (Throwable ignored) {}
                          try { if (tts != null) tts.stop(); } catch (Throwable ignored) {}
                      }
                      // True when something can speak: the AI voice, or the
                      // device fallback. The presenter must not wait forever
                      // for an AI voice that will never arrive.
                      @JavascriptInterface
                      public boolean isReady() { return (voiceReady && !voiceDead) || ttsReady; }
                      // Why the AI voice isn't speaking, in plain words.
                      // Empty while the AI voice is up.
                      @JavascriptInterface
                      public String getLastError() {
                          try {
                              if (voiceReady && !voiceDead) return "";
                              return voiceError == null ? "" : voiceError;
                          } catch (Throwable th) { return ""; }
                      }
                      // Last utterance outcome in plain words, for Settings.
                      @JavascriptInterface
                      public String getLastSpeakInfo() {
                          try { return kittenSpeakInfo == null ? "" : kittenSpeakInfo; }
                          catch (Throwable th) { return ""; }
                      }
                      // Where the :voice process got to while starting the AI
                      // voice (init-start, copy-done, constructing,
                      // constructed, ready, or error: ...). Empty if it never
                      // started. For Settings diagnostics.
                      @JavascriptInterface
                      public String getVoiceStep() {
                          try {
                              java.io.File f = new java.io.File(getFilesDir(), "kitten-voice/.step");
                              if (!f.exists()) return "";
                              java.io.FileInputStream in = new java.io.FileInputStream(f);
                              byte[] b = new byte[(int) Math.min(f.length(), 400)];
                              int r = in.read(b);
                              in.close();
                              if (r <= 0) return "";
                              return new String(b, 0, r, "UTF-8");
                          } catch (Throwable th) { return ""; }
                      }
                      // Try the AI voice again (starts a fresh :voice process).
                      // Safe to tap any time: if its native code crashes again,
                      // only that process dies.
                      @JavascriptInterface
                      public void retryVoice() {
                          try {
                              if (voiceReady && !voiceDead) return; // already up
                              try { unbindService(voiceConn); } catch (Throwable ignored) {}
                              voiceService = null;
                              voiceBound = false;
                              voiceDead = false;
                              voiceReady = false;
                              voiceError = "";
                              bindVoiceService();
                          } catch (Throwable ignored) {}
                      }
                      // "ai" or "device": which voice is actually speaking.
                      @JavascriptInterface
                      public String getActiveVoice() {
                          try { return (voiceReady && !voiceDead) ? "ai" : "device"; }
                          catch (Throwable th) { return "device"; }
                      }
                  }, "KittenVoice");
                  /* In-app updates: download the new APK with DownloadManager
                     and hand it to the system installer via FileProvider. */
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void downloadAndInstall(String url) {
                          try {
                              android.app.DownloadManager dm = (android.app.DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                              android.app.DownloadManager.Request req = new android.app.DownloadManager.Request(android.net.Uri.parse(url));
                              req.setTitle("Weather In Real Time update");
                              req.setDescription("Downloading update…");
                              req.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              java.io.File dir = getExternalFilesDir(android.os.Environment.DIRECTORY_DOWNLOADS);
                              if (dir != null && !dir.exists()) dir.mkdirs();
                              final java.io.File out = new java.io.File(dir, "weather-update.apk");
                              try { if (out.exists()) out.delete(); } catch (Exception ignored) {}
                              req.setDestinationUri(android.net.Uri.fromFile(out));
                              final long dlId = dm.enqueue(req);
                              new Thread(new Runnable() {
                                  @Override public void run() {
                                      boolean ok = false;
                                      for (int i = 0; i < 900 && !ok; i++) {
                                          try { Thread.sleep(1000); } catch (InterruptedException ie) { break; }
                                          android.database.Cursor c = null;
                                          try {
                                              c = dm.query(new android.app.DownloadManager.Query().setFilterById(dlId));
                                              if (c != null && c.moveToFirst()) {
                                                  int st = c.getInt(c.getColumnIndex(android.app.DownloadManager.COLUMN_STATUS));
                                                  if (st == android.app.DownloadManager.STATUS_SUCCESSFUL) ok = true;
                                                  else if (st == android.app.DownloadManager.STATUS_FAILED) break;
                                              }
                                          } catch (Exception ignored) {}
                                          finally { try { if (c != null) c.close(); } catch (Exception ignored) {} }
                                      }
                                      final boolean done = ok;
                                      runOnUiThread(new Runnable() {
                                          @Override public void run() {
                                              if (done) installApk(out);
                                              else android.widget.Toast.makeText(MainActivity.this, "Update download failed.", android.widget.Toast.LENGTH_LONG).show();
                                          }
                                      });
                                  }
                              }).start();
                          } catch (Exception e) {
                              runOnUiThread(new Runnable() {
                                  @Override public void run() {
                                      android.widget.Toast.makeText(MainActivity.this, "Could not start the update.", android.widget.Toast.LENGTH_LONG).show();
                                  }
                              });
                          }
                      }
                  }, "LynxosUpdater");

                  if (savedInstanceState != null) { webView.restoreState(savedInstanceState); }
                  else { webView.loadUrl("file:///android_asset/www/index.html"); }
                  setContentView(webView);
                  webView.requestFocus();
              }
              /* Voice service glue. The AI voice itself lives in
                 KittenService (the ":voice" process); here we only bind to
                 it, route replies back to the page, and fall back to the
                 device voice if its process ever dies. */
              private void bindVoiceService() {
                  try {
                      voiceReply = new android.os.Messenger(new android.os.Handler(android.os.Looper.getMainLooper()) {
                          @Override public void handleMessage(android.os.Message msg) {
                              try {
                                  if (msg.what == KittenService.MSG_DONE) {
                                      jsCall("window.__onTtsDone('kv" + msg.arg1 + "')");
                                  } else if (msg.what == KittenService.MSG_STATE || msg.what == KittenService.MSG_READY) {
                                      boolean r = msg.arg1 == 1;
                                      String err = msg.obj instanceof String ? (String) msg.obj : "";
                                      if (r) {
                                          voiceReady = true; voiceDead = false; voiceError = "";
                                          kittenSpeakInfo = "AI voice ready";
                                      } else if (err != null && !err.isEmpty()) {
                                          onVoiceDied(err, true);
                                      }
                                      // Not ready and no error yet: still warming up.
                                  }
                              } catch (Throwable ignored) {}
                          }
                      });
                      android.content.Intent svc = new android.content.Intent(this, KittenService.class);
                      bindService(svc, voiceConn, android.content.Context.BIND_AUTO_CREATE);
                      // Watchdog: if the service never reports back, stop waiting for it.
                      new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() {
                          @Override public void run() {
                              // Timeout only: the process may still be alive
                              // and slow, so keep the binding — a late
                              // MSG_READY can still revive the AI voice.
                              if (!voiceReady && !voiceDead) onVoiceDied("the voice service did not start in time", false);
                          }
                      }, 90000);
                  } catch (Throwable th) {
                      onVoiceDied("could not start the voice service", true);
                  }
              }
              /* The :voice process is gone (or never came up). Remember why
                 and let every later utterance use the device voice. The app
                 itself keeps running — a dead voice can never kill it. */
              private void onVoiceDied(String reason, boolean deadBinding) {
                  try {
                      if (voiceDead && voiceError != null && !voiceError.isEmpty()) return; // already reported
                      voiceDead = true;
                      voiceReady = false;
                      voiceError = reason == null ? "the AI voice stopped" : reason;
                      kittenSpeakInfo = "AI voice unavailable: " + voiceError + " — using device voice";
                      if (deadBinding) {
                          try { unbindService(voiceConn); } catch (Throwable ignored) {}
                          voiceService = null;
                          voiceBound = false;
                      }
                      // Unstick the page now: its fallback timer would also
                      // advance, but only after 20+ seconds of silence.
                      try {
                          if (lastVoiceUtteranceId != null) {
                              final String doneId = lastVoiceUtteranceId;
                              lastVoiceUtteranceId = null;
                              jsCall("window.__onTtsDone('" + doneId + "')");
                          }
                      } catch (Throwable ignored2) {}
                  } catch (Throwable ignored) {}
              }
              /* Device-voice fallback: speak one utterance with the system
                 voice and report completion exactly like the AI voice does,
                 so the page's queue keeps moving. */
              private String deviceSpeak(String text) {
                  try {
                      if (!ttsReady || tts == null) { kittenSpeakInfo = "device voice not ready yet"; return null; }
                      final String id = "dv" + (++ttsUtteranceSeq);
                      kittenSpeakInfo = "device voice: " + text.length() + " chars";
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id);
                      lastVoiceUtteranceId = id;
                      return id;
                  } catch (Throwable th) {
                      kittenSpeakInfo = "device voice failed";
                      return null;
                  }
              }

              private void installApk(java.io.File apk) {
                  // Hand the downloaded APK to the system package installer.
                  // First run per app: Android takes the user to grant
                  // "install unknown apps", then they tap install.
                  try {
                      android.net.Uri uri = androidx.core.content.FileProvider.getUriForFile(
                          this, "com.weatherrealtime.app.fileprovider", apk);
                      android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_VIEW);
                      intent.setDataAndType(uri, "application/vnd.android.package-archive");
                      intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK
                          | android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(intent);
                  } catch (Exception e) {
                      android.widget.Toast.makeText(this, "Could not open the installer.", android.widget.Toast.LENGTH_LONG).show();
                  }
              }
              private void initTts() {
                  String engine = null;
                  try {
                      // Prefer Google's TTS engine — its voices sound far more
                      // human than the stock Samsung engine on most devices.
                      getPackageManager().getPackageInfo("com.google.android.tts", 0);
                      engine = "com.google.android.tts";
                  } catch (Exception ignored) {}
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try {
                                  int result = tts.setLanguage(Locale.US);
                                  ttsReady = result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED;
                              } catch (Exception e) { ttsReady = false; }
                              if (ttsReady) {
                                  try {
                                      // Slightly under 1.0: calmer, more natural pacing.
                                      tts.setSpeechRate(0.85f);
                                      // A touch lower than default pitch reads warmer, less robotic.
                                      tts.setPitch(0.93f);
                                      // The device voice only speaks one emergency sentence if the
                                      // AI voice fails to load: always pick the best English voice.
                                      pickBestTtsVoice();
                                      // The voice list can load late — re-pick once it arrives.
                                      try { new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() { @Override public void run() { pickBestTtsVoice(); } }, 3000); } catch (Exception ignored2) {}
                                      tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                          @Override public void onStart(String utteranceId) {}
                                          @Override public void onDone(String utteranceId) { ttsDoneCallback(utteranceId); }
                                          @Override public void onError(String utteranceId) { ttsDoneCallback(utteranceId); }
                                          @Override public void onStop(String utteranceId, boolean interrupted) { ttsDoneCallback(utteranceId); }
                                      });
                                  } catch (Exception ignored) {}
                                  if (pendingTts != null) {
                                      String text = pendingTts; pendingTts = null;
                                      try { doTtsSpeak(text); } catch (Exception ignored) {}
                                  }
                              }
                          }
                      }
                  }, engine);
              }
              /* Pick the highest-quality English voice the engine offers.
                 Neural / natural / premium voices sound far more human than
                 the default compact voice, so prefer them by name and quality. */
              private void pickBestTtsVoice() {
                  try {
                      if (tts == null) return;
                      java.util.Set<android.speech.tts.Voice> voices = tts.getVoices();
                      if (voices == null || voices.isEmpty()) return;
                      android.speech.tts.Voice best = null;
                      int bestScore = -1000000;
                      for (android.speech.tts.Voice v : voices) {
                          java.util.Locale loc = v.getLocale();
                          if (loc == null || !"en".equalsIgnoreCase(loc.getLanguage())) continue;
                          String n = v.getName() == null ? "" : v.getName().toLowerCase(java.util.Locale.US);
                          int s = 0;
                          // Justin wants the US voice, not the British one.
                          if ("US".equalsIgnoreCase(loc.getCountry())) s += 100;
                          else s -= 100;
                          if (n.contains("wavenet")) s += 60;
                          if (n.contains("neural")) s += 50;
                          if (n.contains("natural")) s += 40;
                          if (n.contains("premium") || n.contains("enhanced")) s += 30;
                          if (n.contains("google")) s += 20;
                          if (n.contains("compact") || n.contains("robot")) s -= 60;
                          try {
                              int q = v.getQuality();
                              if (q >= 400) s += 25;
                              else if (q >= 300) s += 10;
                          } catch (Exception ignored) {}
                          if (v.isNetworkConnectionRequired()) s -= 5;
                          if (s > bestScore) { bestScore = s; best = v; }
                      }
                      if (best != null) { try { tts.setVoice(best); } catch (Exception ignored) {} }
                  } catch (Exception ignored) {}
              }
              private void jsCall(final String expr) {
                  try {
                      final WebView wv = webView;
                      if (wv == null) return;
                      wv.post(new Runnable() {
                          @Override public void run() {
                              try { wv.evaluateJavascript(expr, null); } catch (Exception ignored) {}
                          }
                      });
                  } catch (Exception ignored) {}
              }
              private String doTtsSpeak(String text) {
                  String id = "utt" + (++ttsUtteranceSeq);
                  try { tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id); } catch (Exception ignored) {}
                  return id;
              }
              private void ttsDoneCallback(final String utteranceId) {
                  try {
                      final WebView wv = webView;
                      if (wv == null) return;
                      wv.post(new Runnable() {
                          @Override public void run() {
                              try { wv.evaluateJavascript("window.__onTtsDone('" + utteranceId + "')", null); } catch (Exception ignored) {}
                          }
                      });
                  } catch (Exception ignored) {}
              }
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == LOCATION_REQUEST) {
                      boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (pendingGeoCallback != null) {
                          try { pendingGeoCallback.invoke(pendingGeoOrigin, granted, false); } catch (Exception ignored) {}
                          pendingGeoCallback = null; pendingGeoOrigin = null;
                      }
                  }
              }
              @Override
              protected void onDestroy() {
                  if (tts != null) { try { tts.stop(); tts.shutdown(); } catch (Exception ignored) {} tts = null; }
                  super.onDestroy();
              }
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) { webView.saveState(outState); }
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) { webView.goBack(); return; }
                  // If the app has a menu or panel open, close it instead of exiting (D-pad back on TV).
                  boolean uiOpen = false;
                  try {
                      uiOpen = "1".equals(getSharedPreferences("weather_realtime", MODE_PRIVATE).getString("wrt_ui_open", "0"));
                  } catch (Exception ignored) {}
                  if (uiOpen && webView != null) {
                      webView.evaluateJavascript("if(window.__wrtCloseUi)window.__wrtCloseUi();", null);
                      return;
                  }
                  // Double-press back to exit, so one stray press never kills the app mid-storm.
                  long now = System.currentTimeMillis();
                  if (now - lastBackPress < 2500) { super.onBackPressed(); return; }
                  lastBackPress = now;
                  android.widget.Toast.makeText(this, "Press back again to exit", android.widget.Toast.LENGTH_SHORT).show();
              }
          }
