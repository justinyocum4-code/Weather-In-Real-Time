name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0)'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Version code - must be a whole number bigger than last time'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'What changed in this version (shown in the store)'
        required: false
        type: string
        default: ''

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ inputs.version_name || '1.0' }}
      APP_VERSION_CODE: ${{ inputs.version_code || '1' }}
      APP_RELEASE_NOTES: ${{ inputs.release_notes || 'Update' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Inject TomTom key (if the TOMTOM_KEY repo secret is set)
        env:
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          if [ -n "$TOMTOM_KEY" ]; then
            python3 - "$TOMTOM_KEY" <<'PYEOF'
          import sys
          key = sys.argv[1]
          p = "index.html"
          s = open(p).read()
          assert "%%TOMTOM_KEY%%" in s, "TomTom key placeholder missing from index.html"
          open(p, "w").write(s.replace("%%TOMTOM_KEY%%", key))
          print("TomTom key injected into index.html.")
          PYEOF
          else
            echo "No TOMTOM_KEY secret set; the traffic layer stays silent."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Scaffold Android project
        run: |
          HTML_FILE=./index.html
          if [ ! -f "$HTML_FILE" ]; then echo "ERROR: index.html missing in repo root."; exit 1; fi
          if ! grep -q 'id="weather-realtime-app"' "$HTML_FILE"; then echo "ERROR: weather-realtime-app marker missing."; exit 1; fi
          mkdir -p app/src/main/java/com/weatherrealtime/app app/src/main/assets/www
          cp "$HTML_FILE" app/src/main/assets/www/index.html
          mkdir -p app/src/main/res/drawable
          if [ -f tv_banner.png ]; then
            cp tv_banner.png app/src/main/res/drawable/tv_banner.png
            echo "TV banner installed."
          else
            echo "WARNING: tv_banner.png not found; Leanback banner skipped."
          fi
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" } // sherpa-onnx (Kitten voice engine)
              }
          }
          rootProject.name = "WeatherRealtime"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          # Larger Gradle heap for safety on the CI runners (GitHub runners have 16GB RAM).
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.weatherrealtime.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.weatherrealtime.app'
                  minSdk 24
                  targetSdk 34
                  versionCode __APP_VERSION_CODE__
                  versionName '__APP_VERSION_NAME__'
                  ndk {
                      // Phone + Android TV / Fire TV sticks. x86_64 (emulators) dropped to save size.
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }
              }
              dependencies {
                  implementation 'androidx.core:core:1.12.0'
                  // On-device AI voice (Kitten via sherpa-onnx). Official build, re-published by JitPack.
                  implementation 'com.github.k2-fsa:sherpa-onnx:v1.12.40'
                  // The voice engine is written in Kotlin; without the stdlib it crashes
                  // on startup with NoClassDefFoundError (kotlin/jvm/internal/Intrinsics).
                  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
              }
          }
          EOF
          sed -i "s/__APP_VERSION_CODE__/$APP_VERSION_CODE/g; s/__APP_VERSION_NAME__/$APP_VERSION_NAME/g" app/build.gradle
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <application
                  android:label="Weather In Real Time"
                  android:banner="@drawable/tv_banner"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name="com.weatherrealtime.app.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="com.weatherrealtime.app.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="downloads" path="Download/" />
          </paths>
          EOF
          cat > app/src/main/java/com/weatherrealtime/app/MainActivity.java <<'EOF'
          package com.weatherrealtime.app;
          import android.app.Activity;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;
          public class MainActivity extends Activity {
              private WebView webView;
              private static final int LOCATION_REQUEST = 1002;
              private GeolocationPermissions.Callback pendingGeoCallback = null;
              private String pendingGeoOrigin = null;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private String pendingTts = null;
              private long lastBackPress = 0;
              private int ttsUtteranceSeq = 0;
              // Kitten on-device AI voice (the app's only voice): the
              // sherpa-onnx engine plus serialized playback state.
              private com.k2fsa.sherpa.onnx.OfflineTts kittenTts;
              private boolean kittenReady = false;
              private boolean kittenStarting = false;
              private int kittenGen = 0; // speak() generation: stop() silences older ones
              private android.media.AudioTrack kittenTrack;
              private String kittenSpeakInfo;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Crash recorder: if anything ever slips past the guards,
                  // save a one-line reason so the app can report it on the
                  // next launch instead of dying mysteriously.
                  try {
                      final android.content.SharedPreferences crashP = getSharedPreferences("weather_realtime", MODE_PRIVATE);
                      final Thread.UncaughtExceptionHandler prevHandler = Thread.getDefaultUncaughtExceptionHandler();
                      Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                          @Override public void uncaughtException(Thread t, Throwable e) {
                              try {
                                  String msg = String.valueOf(e);
                                  if (msg.length() > 220) msg = msg.substring(0, 220);
                                  crashP.edit().putString("last_crash", msg).apply();
                              } catch (Throwable ignored) {}
                              try { if (prevHandler != null) prevHandler.uncaughtException(t, e); } catch (Throwable ignored) {}
                          }
                      });
                  } catch (Throwable ignored) {}
                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF000000); // never flash white on load/redraw
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowFileAccessFromFileURLs(true);
                  webView.getSettings().setAllowUniversalAccessFromFileURLs(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false); // alert audio must play hands-free
                  webView.setWebViewClient(new WebViewClient());
                  webView.getSettings().setGeolocationEnabled(true);
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_COARSE_LOCATION}, LOCATION_REQUEST);
                          }
                      }
                  });
                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void setItem(String key, String value) {
                          try { getSharedPreferences("weather_realtime", MODE_PRIVATE).edit().putString(key, value).commit(); } catch (Exception ignored) {}
                      }
                      @JavascriptInterface
                      public String getItem(String key) {
                          try { return getSharedPreferences("weather_realtime", MODE_PRIVATE).getString(key, null); } catch (Exception e) { return null; }
                      }
                      @JavascriptInterface
                      public String getLastCrash() {
                          try {
                              android.content.SharedPreferences p = getSharedPreferences("weather_realtime", MODE_PRIVATE);
                              String c = p.getString("last_crash", null);
                              if (c != null) p.edit().remove("last_crash").apply();
                              return c == null ? "" : c;
                          } catch (Exception e) { return ""; }
                      }
                      @JavascriptInterface
                      public void removeItem(String key) {
                          try { getSharedPreferences("weather_realtime", MODE_PRIVATE).edit().remove(key).commit(); } catch (Exception ignored) {}
                      }
                  }, "LynxosStore");
                  initTts();
                  kittenEnsureInit(); // warm up the on-device AI voice in the background
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public String speak(String text) {
                          if (text == null) return null;
                          if (ttsReady && tts != null) {
                              return doTtsSpeak(text);
                          } else { pendingTts = text; return null; }
                      }
                      @JavascriptInterface
                      public void stop() {
                          pendingTts = null;
                          try { if (tts != null) tts.stop(); } catch (Exception ignored) {}
                      }
                      /* The device voice is no longer a choice — it only
                         speaks one emergency sentence if the AI voice fails
                         to load. The voice picker is gone. */
                  }, "LynxosTts");
                  /* Kitten on-device AI voice: the app's only voice. Free,
                     offline, no key, no quota. Returns an utterance id, or
                     null when the voice isn't warmed up yet (the page waits
                     and retries). Synthesis runs on a worker thread; playback
                     goes through one serialized AudioTrack so utterances can
                     never double up. */
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public String speak(String text) {
                          try {
                              if (text == null || text.isEmpty()) { kittenSpeakInfo = "speak skipped: empty text"; return null; }
                              if (!kittenReady || kittenTts == null) { kittenSpeakInfo = "speak skipped: voice not ready"; kittenEnsureInit(); return null; }
                              kittenSpeakInfo = "speak called: " + text.length() + " chars";
                              kittenGen++; // silence anything currently playing
                              try { android.media.AudioTrack tr = kittenTrack; if (tr != null) tr.stop(); } catch (Throwable ignored) {}
                              final String id = "kv" + (++ttsUtteranceSeq);
                              final int gen = kittenGen;
                              final String t = text;
                              new Thread(new Runnable() { @Override public void run() {
                                  kittenSpeakWorker(id, t, gen);
                              } }).start();
                              return id;
                          } catch (Throwable th) {
                              String msg = String.valueOf(th);
                              if (msg.length() > 200) msg = msg.substring(0, 200);
                              kittenSpeakInfo = "speak FAILED at entry: " + msg;
                              return null;
                          }
                      }
                      @JavascriptInterface
                      public void stop() {
                          kittenGen++;
                          try { android.media.AudioTrack tr = kittenTrack; if (tr != null) tr.stop(); } catch (Throwable ignored) {}
                      }
                      // True once the offline AI voice is warmed up and speaking.
                      @JavascriptInterface
                      public boolean isReady() { return kittenReady && kittenTts != null; }
                      // If the last init attempt failed, the reason (saved to
                      // a file so it survives to the next launch). Empty when
                      // the voice is ready or no failure was recorded.
                      @JavascriptInterface
                      public String getLastError() {
                          try {
                              if (kittenReady) return "";
                              java.io.File f = new java.io.File(getFilesDir(), "kitten-voice/.last-error");
                              if (!f.exists()) return "";
                              java.io.FileInputStream in = new java.io.FileInputStream(f);
                              byte[] b = new byte[(int) Math.min(f.length(), 512)];
                              int n = in.read(b); in.close();
                              if (n <= 0) return "";
                              return new String(b, 0, n, "UTF-8");
                          } catch (Throwable th) { return ""; }
                      }
                      // Last synthesis/playback outcome in plain words.
                      // Shown in Settings under the voice status.
                      @JavascriptInterface
                      public String getLastSpeakInfo() {
                          try { return kittenSpeakInfo == null ? "" : kittenSpeakInfo; }
                          catch (Throwable th) { return ""; }
                      }
                  }, "KittenVoice");
                  /* In-app updates: download the new APK with DownloadManager
                     and hand it to the system installer via FileProvider. */
                  webView.addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void downloadAndInstall(String url) {
                          try {
                              android.app.DownloadManager dm = (android.app.DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                              android.app.DownloadManager.Request req = new android.app.DownloadManager.Request(android.net.Uri.parse(url));
                              req.setTitle("Weather In Real Time update");
                              req.setDescription("Downloading update…");
                              req.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              java.io.File dir = getExternalFilesDir(android.os.Environment.DIRECTORY_DOWNLOADS);
                              if (dir != null && !dir.exists()) dir.mkdirs();
                              final java.io.File out = new java.io.File(dir, "weather-update.apk");
                              try { if (out.exists()) out.delete(); } catch (Exception ignored) {}
                              req.setDestinationUri(android.net.Uri.fromFile(out));
                              final long dlId = dm.enqueue(req);
                              new Thread(new Runnable() {
                                  @Override public void run() {
                                      boolean ok = false;
                                      for (int i = 0; i < 900 && !ok; i++) {
                                          try { Thread.sleep(1000); } catch (InterruptedException ie) { break; }
                                          android.database.Cursor c = null;
                                          try {
                                              c = dm.query(new android.app.DownloadManager.Query().setFilterById(dlId));
                                              if (c != null && c.moveToFirst()) {
                                                  int st = c.getInt(c.getColumnIndex(android.app.DownloadManager.COLUMN_STATUS));
                                                  if (st == android.app.DownloadManager.STATUS_SUCCESSFUL) ok = true;
                                                  else if (st == android.app.DownloadManager.STATUS_FAILED) break;
                                              }
                                          } catch (Exception ignored) {}
                                          finally { try { if (c != null) c.close(); } catch (Exception ignored) {} }
                                      }
                                      final boolean done = ok;
                                      runOnUiThread(new Runnable() {
                                          @Override public void run() {
                                              if (done) installApk(out);
                                              else android.widget.Toast.makeText(MainActivity.this, "Update download failed.", android.widget.Toast.LENGTH_LONG).show();
                                          }
                                      });
                                  }
                              }).start();
                          } catch (Exception e) {
                              runOnUiThread(new Runnable() {
                                  @Override public void run() {
                                      android.widget.Toast.makeText(MainActivity.this, "Could not start the update.", android.widget.Toast.LENGTH_LONG).show();
                                  }
                              });
                          }
                      }
                  }, "LynxosUpdater");

                  if (savedInstanceState != null) { webView.restoreState(savedInstanceState); }
                  else { webView.loadUrl("file:///android_asset/www/index.html"); }
                  setContentView(webView);
                  webView.requestFocus();
              }
              /* Copy the bundled Kitten voice out of the APK into private
                 storage (native code needs real file paths), then build
                 the sherpa-onnx TTS engine on a worker thread. The copy is
                 resumable: files already synced are skipped and each file is
                 written atomically, so killing the app mid-copy just resumes
                 next launch instead of starting over. */
              private void kittenEnsureInit() {
                  if (kittenReady || kittenStarting) return;
                  kittenStarting = true;
                  new Thread(new Runnable() { @Override public void run() {
                      try {
                          java.io.File dest = new java.io.File(getFilesDir(), "kitten-voice");
                          java.io.File marker = new java.io.File(dest, ".ready");
                          java.io.File errFile = new java.io.File(dest, ".last-error");
                          if (!marker.exists()) {
                              syncAssetDir("kitten-voice", dest);
                              marker.createNewFile();
                          }
                          java.io.File modelFile = new java.io.File(dest, "model.onnx");
                          java.io.File voicesFile = new java.io.File(dest, "voices.bin");
                          java.io.File tokensFile = new java.io.File(dest, "tokens.txt");
                          java.io.File dataDir = new java.io.File(dest, "espeak-ng-data");
                          if (!modelFile.exists() || !voicesFile.exists() || !tokensFile.exists() || !dataDir.exists())
                              throw new RuntimeException("kitten voice files missing");
                          // sherpa-onnx Android: the OfflineTts constructor takes a
                          // nullable AssetManager. Passing null selects the
                          // file-based native path (newFromFile), which reads the
                          // absolute filesystem paths set above directly.
                          // Passing getAssets() makes native code treat those
                          // absolute paths as APK asset names, which fails.
                          com.k2fsa.sherpa.onnx.OfflineTtsKittenModelConfig kitten =
                              new com.k2fsa.sherpa.onnx.OfflineTtsKittenModelConfig();
                          kitten.setModel(modelFile.getAbsolutePath());
                          kitten.setVoices(voicesFile.getAbsolutePath());
                          kitten.setTokens(tokensFile.getAbsolutePath());
                          kitten.setDataDir(dataDir.getAbsolutePath());
                          com.k2fsa.sherpa.onnx.OfflineTtsModelConfig modelConfig =
                              new com.k2fsa.sherpa.onnx.OfflineTtsModelConfig();
                          modelConfig.setKitten(kitten);
                          modelConfig.setNumThreads(4);
                          com.k2fsa.sherpa.onnx.OfflineTtsConfig config =
                              new com.k2fsa.sherpa.onnx.OfflineTtsConfig();
                          config.setModel(modelConfig);
                          config.setMaxNumSentences(1);
                          kittenTts = new com.k2fsa.sherpa.onnx.OfflineTts(null, config);
                          // Honest warm-up: proves synthesis actually works
                          // (male voice 1, sid 0 — the voice you picked).
                          // Warm-up failure throws, so a broken voice keeps
                          // reporting its error instead of claiming "Ready".
                          com.k2fsa.sherpa.onnx.GeneratedAudio warm =
                              kittenTts.generate("Voice ready.", 0, 1.0f);
                          float[] ws = warm != null ? warm.getSamples() : null;
                          if (ws == null || ws.length == 0)
                              throw new RuntimeException("warm-up produced no audio");
                          kittenSpeakInfo = "warm-up OK: " + ws.length + " samples";
                          kittenReady = true;
                          try { errFile.delete(); } catch (Throwable ignored) {}
                      } catch (Throwable t) {
                          // Persist the reason so the next launch can report it
                          // aloud instead of failing silently forever.
                          try {
                              java.io.File dest = new java.io.File(getFilesDir(), "kitten-voice");
                              dest.mkdirs();
                              String msg = String.valueOf(t);
                              if (msg.length() > 300) msg = msg.substring(0, 300);
                              java.io.FileOutputStream out = new java.io.FileOutputStream(new java.io.File(dest, ".last-error"));
                              out.write(msg.getBytes("UTF-8"));
                              out.close();
                          } catch (Throwable ignored) {}
                          kittenStarting = false; // let a later speak() retry
                      }
                  } }).start();
              }
              /* One utterance on a worker thread: synthesize, then play the
                 raw samples through a serialized AudioTrack. A generation
                 counter stops stale playback when stop() is called. */
              private void kittenSpeakWorker(String id, String text, int gen) {
                  try {
                      com.k2fsa.sherpa.onnx.GeneratedAudio audio = kittenTts.generate(text, 0, 1.0f);
                      if (gen != kittenGen) return; // stopped while synthesizing
                      float[] samples = audio.getSamples();
                      int sr = audio.getSampleRate();
                      short[] pcm = new short[samples.length];
                      for (int i = 0; i < samples.length; i++) {
                          float v = Math.max(-1f, Math.min(1f, samples[i]));
                          pcm[i] = (short) (v * 32767);
                      }
                      int ch = android.media.AudioFormat.CHANNEL_OUT_MONO;
                      int fmt = android.media.AudioFormat.ENCODING_PCM_16BIT;
                      int minBuf = android.media.AudioTrack.getMinBufferSize(sr, ch, fmt);
                      android.media.AudioTrack track = new android.media.AudioTrack(
                          android.media.AudioManager.STREAM_MUSIC, sr, ch, fmt,
                          Math.max(minBuf, pcm.length * 2), android.media.AudioTrack.MODE_STREAM);
                      kittenTrack = track;
                      kittenSpeakInfo = "played " + pcm.length + " samples @ " + sr + "Hz";
                      track.play();
                      int off = 0;
                      while (off < pcm.length && gen == kittenGen) {
                          int len = Math.min(8192, pcm.length - off);
                          track.write(pcm, off, len);
                          off += len;
                      }
                      try { track.stop(); } catch (Throwable ignored) {}
                      try { track.release(); } catch (Throwable ignored) {}
                      if (kittenTrack == track) kittenTrack = null;
                      if (gen == kittenGen) jsCall("window.__onTtsDone('" + id + "')");
                  } catch (Throwable t) {
                      // Claimed the utterance but couldn't render it: record
                      // the reason where Settings can show it, then advance
                      // the queue rather than stalling it.
                      String msg = String.valueOf(t);
                      if (msg.length() > 300) msg = msg.substring(0, 300);
                      kittenSpeakInfo = "speak FAILED: " + msg;
                      try { jsCall("window.__onTtsDone('" + id + "')"); } catch (Throwable ignored) {}
                  }
              }
              /* Copy one asset tree into private storage, skipping files that
                 are already there. Each file is written to a .part file and
                 renamed, so a kill mid-copy can never leave a half file:
                 anything present is complete, and the next launch resumes
                 where the last one stopped. */
              private void syncAssetDir(String assetPath, java.io.File dest) throws java.io.IOException {
                  String[] names = getAssets().list(assetPath);
                  if (names == null) return;
                  dest.mkdirs();
                  for (String n : names) {
                      String rel = assetPath.isEmpty() ? n : assetPath + "/" + n;
                      String[] sub = getAssets().list(rel);
                      if (sub != null && sub.length > 0) {
                          syncAssetDir(rel, new java.io.File(dest, n));
                      } else {
                          java.io.File out = new java.io.File(dest, n);
                          if (out.exists()) continue;
                          java.io.File part = new java.io.File(dest, n + ".part");
                          java.io.InputStream in = getAssets().open(rel);
                          java.io.FileOutputStream fos = new java.io.FileOutputStream(part);
                          byte[] buf = new byte[65536];
                          int r;
                          while ((r = in.read(buf)) > 0) fos.write(buf, 0, r);
                          fos.close();
                          in.close();
                          if (!part.renameTo(out)) {
                              java.io.FileInputStream fin = new java.io.FileInputStream(part);
                              java.io.FileOutputStream fout = new java.io.FileOutputStream(out);
                              byte[] b2 = new byte[65536];
                              int r2;
                              while ((r2 = fin.read(b2)) > 0) fout.write(b2, 0, r2);
                              fout.close();
                              fin.close();
                              part.delete();
                          }
                      }
                  }
              }

              private void installApk(java.io.File apk) {
                  // Hand the downloaded APK to the system package installer.
                  // First run per app: Android takes the user to grant
                  // "install unknown apps", then they tap install.
                  try {
                      android.net.Uri uri = androidx.core.content.FileProvider.getUriForFile(
                          this, "com.weatherrealtime.app.fileprovider", apk);
                      android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_VIEW);
                      intent.setDataAndType(uri, "application/vnd.android.package-archive");
                      intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK
                          | android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(intent);
                  } catch (Exception e) {
                      android.widget.Toast.makeText(this, "Could not open the installer.", android.widget.Toast.LENGTH_LONG).show();
                  }
              }
              private void initTts() {
                  String engine = null;
                  try {
                      // Prefer Google's TTS engine — its voices sound far more
                      // human than the stock Samsung engine on most devices.
                      getPackageManager().getPackageInfo("com.google.android.tts", 0);
                      engine = "com.google.android.tts";
                  } catch (Exception ignored) {}
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status == TextToSpeech.SUCCESS) {
                              try {
                                  int result = tts.setLanguage(Locale.US);
                                  ttsReady = result != TextToSpeech.LANG_MISSING_DATA && result != TextToSpeech.LANG_NOT_SUPPORTED;
                              } catch (Exception e) { ttsReady = false; }
                              if (ttsReady) {
                                  try {
                                      // Slightly under 1.0: calmer, more natural pacing.
                                      tts.setSpeechRate(0.85f);
                                      // A touch lower than default pitch reads warmer, less robotic.
                                      tts.setPitch(0.93f);
                                      // The device voice only speaks one emergency sentence if the
                                      // AI voice fails to load: always pick the best English voice.
                                      pickBestTtsVoice();
                                      // The voice list can load late — re-pick once it arrives.
                                      try { new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(new Runnable() { @Override public void run() { pickBestTtsVoice(); } }, 3000); } catch (Exception ignored2) {}
                                      tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                          @Override public void onStart(String utteranceId) {}
                                          @Override public void onDone(String utteranceId) { ttsDoneCallback(utteranceId); }
                                          @Override public void onError(String utteranceId) { ttsDoneCallback(utteranceId); }
                                          @Override public void onStop(String utteranceId, boolean interrupted) { ttsDoneCallback(utteranceId); }
                                      });
                                  } catch (Exception ignored) {}
                                  if (pendingTts != null) {
                                      String text = pendingTts; pendingTts = null;
                                      try { doTtsSpeak(text); } catch (Exception ignored) {}
                                  }
                              }
                          }
                      }
                  }, engine);
              }
              /* Pick the highest-quality English voice the engine offers.
                 Neural / natural / premium voices sound far more human than
                 the default compact voice, so prefer them by name and quality. */
              private void pickBestTtsVoice() {
                  try {
                      if (tts == null) return;
                      java.util.Set<android.speech.tts.Voice> voices = tts.getVoices();
                      if (voices == null || voices.isEmpty()) return;
                      android.speech.tts.Voice best = null;
                      int bestScore = -1000000;
                      for (android.speech.tts.Voice v : voices) {
                          java.util.Locale loc = v.getLocale();
                          if (loc == null || !"en".equalsIgnoreCase(loc.getLanguage())) continue;
                          String n = v.getName() == null ? "" : v.getName().toLowerCase(java.util.Locale.US);
                          int s = 0;
                          // Justin wants the US voice, not the British one.
                          if ("US".equalsIgnoreCase(loc.getCountry())) s += 100;
                          else s -= 100;
                          if (n.contains("wavenet")) s += 60;
                          if (n.contains("neural")) s += 50;
                          if (n.contains("natural")) s += 40;
                          if (n.contains("premium") || n.contains("enhanced")) s += 30;
                          if (n.contains("google")) s += 20;
                          if (n.contains("compact") || n.contains("robot")) s -= 60;
                          try {
                              int q = v.getQuality();
                              if (q >= 400) s += 25;
                              else if (q >= 300) s += 10;
                          } catch (Exception ignored) {}
                          if (v.isNetworkConnectionRequired()) s -= 5;
                          if (s > bestScore) { bestScore = s; best = v; }
                      }
                      if (best != null) { try { tts.setVoice(best); } catch (Exception ignored) {} }
                  } catch (Exception ignored) {}
              }
              private void jsCall(final String expr) {
                  try {
                      final WebView wv = webView;
                      if (wv == null) return;
                      wv.post(new Runnable() {
                          @Override public void run() {
                              try { wv.evaluateJavascript(expr, null); } catch (Exception ignored) {}
                          }
                      });
                  } catch (Exception ignored) {}
              }
              private String doTtsSpeak(String text) {
                  String id = "utt" + (++ttsUtteranceSeq);
                  try { tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id); } catch (Exception ignored) {}
                  return id;
              }
              private void ttsDoneCallback(final String utteranceId) {
                  try {
                      final WebView wv = webView;
                      if (wv == null) return;
                      wv.post(new Runnable() {
                          @Override public void run() {
                              try { wv.evaluateJavascript("window.__onTtsDone('" + utteranceId + "')", null); } catch (Exception ignored) {}
                          }
                      });
                  } catch (Exception ignored) {}
              }
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == LOCATION_REQUEST) {
                      boolean granted = grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED;
                      if (pendingGeoCallback != null) {
                          try { pendingGeoCallback.invoke(pendingGeoOrigin, granted, false); } catch (Exception ignored) {}
                          pendingGeoCallback = null; pendingGeoOrigin = null;
                      }
                  }
              }
              @Override
              protected void onDestroy() {
                  if (tts != null) { try { tts.stop(); tts.shutdown(); } catch (Exception ignored) {} tts = null; }
                  super.onDestroy();
              }
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) { webView.saveState(outState); }
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) { webView.goBack(); return; }
                  // If the app has a menu or panel open, close it instead of exiting (D-pad back on TV).
                  boolean uiOpen = false;
                  try {
                      uiOpen = "1".equals(getSharedPreferences("weather_realtime", MODE_PRIVATE).getString("wrt_ui_open", "0"));
                  } catch (Exception ignored) {}
                  if (uiOpen && webView != null) {
                      webView.evaluateJavascript("if(window.__wrtCloseUi)window.__wrtCloseUi();", null);
                      return;
                  }
                  // Double-press back to exit, so one stray press never kills the app mid-storm.
                  long now = System.currentTimeMillis();
                  if (now - lastBackPress < 2500) { super.onBackPressed(); return; }
                  lastBackPress = now;
                  android.widget.Toast.makeText(this, "Press back again to exit", android.widget.Toast.LENGTH_SHORT).show();
              }
          }
          EOF

      - name: Fetch Kitten voice model (on-device AI voice)
        run: |
          mkdir -p app/src/main/assets/kitten-voice
          cd app/src/main/assets/kitten-voice
          # KittenTTS Micro, English (Apache 2.0, free to bundle): ~40MB model +
          # 3.2MB voices + the English espeak-ng data (trimmed, tested).
          curl -fSL --retry 3 -o kitten.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kitten-micro-en-v0_8.tar.bz2"
          tar xf kitten.tar.bz2
          mv kitten-micro-en-v0_8/* .
          rm -rf kitten-micro-en-v0_8 kitten.tar.bz2
          # Keep only the English espeak-ng data: synthesis was tested this way.
          mkdir -p /tmp/espeak-trim/lang/gmw
          D=espeak-ng-data
          cp "$D/en_dict" "$D/phondata" "$D/phondata-manifest" "$D/phonindex" "$D/phontab" "$D/intonations" /tmp/espeak-trim/
          cp "$D/lang/gmw/en-US" "$D/lang/gmw/en" /tmp/espeak-trim/lang/gmw/
          rm -rf espeak-ng-data
          mv /tmp/espeak-trim espeak-ng-data
          ls -la
          du -sh .
          test -f model.onnx && test -f voices.bin && test -f tokens.txt && test -d espeak-ng-data

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease

      - name: Sign release APK with the Lynxos key
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/lynxos-release.p12
          "$APKSIGNER" sign --ks /tmp/lynxos-release.p12 --ks-type PKCS12 \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f /tmp/lynxos-release.p12
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-realtime-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          name: v${{ env.APP_VERSION_NAME }}+${{ env.APP_VERSION_CODE }}
          body: ${{ env.APP_RELEASE_NOTES }}
          files: app/build/outputs/apk/release/app-release.apk
